<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Emirates PTFS weekly flight board."><title>Flight board · Emirates PTFS</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="booking">
  <div id="header"></div>
  <main class="interior-main">
    <section class="interior-hero" style="background:url('assets/photos/fleet-sunset-a380.png') center/cover">
      <div class="shell"><p class="eyebrow">Dubai · Flight operations</p><h1>The flight board.</h1><p>Every departure and arrival for this week, straight from the operations desk.</p></div>
    </section>
    <section class="interior-section paper">
      <div class="shell">
        <div class="section-head"><div><p class="eyebrow">Live schedule</p><h2>Find your next sector.</h2></div></div>
        <div class="board-panel">
          <div class="board-toolbar">
            <label><span aria-hidden="true">⌕</span><input id="flight-search" type="search" placeholder="Search flight, destination or aircraft" autocomplete="off"></label>
            <div class="board-filters" role="tablist" aria-label="Filter flight board"><button class="is-active" type="button" data-airline="all">All</button><button type="button" data-airline="EK">Emirates</button><button type="button" data-airline="FZ">flydubai</button><button type="button" data-airline="other">Other</button></div>
          </div>
          <p class="board-status" id="board-status">Loading live operations…</p>
          <div class="flight-board" id="weekly-flights-list" aria-live="polite"><div class="empty-board">Loading the flight board…</div></div>
          <div class="board-footnote"><span>All times UTC · Schedule is subject to operations.</span><a href="https://emirates-ptfs-fids.onrender.com/departures" target="_blank" rel="noopener">Open live departures ↗</a></div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>
  <script src="script.js"></script>
</body>
</html>
