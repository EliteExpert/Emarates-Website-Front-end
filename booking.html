<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#d71921">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="The weekly Emirates PTFS flight schedule — every departure and arrival for this week, straight from flight operations.">
    <title>Weekly Flights - Emirates PTFS</title>
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
</head>
<body>
    <!-- Header -->
    <div id="header"></div>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <div>
                <p class="eyebrow">Dubai · UAE</p>
                <h1>Weekly Flights</h1>
                <p class="intro">Every departure and arrival for this week, straight from flight operations.</p>
            </div>
            <div class="flip-clock" id="live-clock" aria-label="Current GMT time" role="timer"></div>
        </div>
    </section>
    <div class="container">
        <div class="page-banner" style="background-image: url('assets/photos/fleet-sunset-a380.png');">
            <span class="page-banner-caption">Golden hour departures</span>
        </div>
    </div>


    <!-- Weekly Flights Section (FIDS board) -->
    <section class="status-section">
        <div class="container">
            <section class="flight-panel" aria-label="Weekly flight search and results">
                <label class="search" for="flight-search">
                    <span aria-hidden="true">⌕</span>
                    <input id="flight-search" type="search" placeholder="Search by flight number, destination or aircraft" autocomplete="off">
                </label>

                <div class="airline-tabs" id="airline-tabs" role="tablist" aria-label="Filter by airline">
                    <button class="airline-tab is-active" type="button" data-airline="all">All airlines</button>
                    <button class="airline-tab" type="button" data-airline="EK"><img src="assets/emirates-tail.png" alt="">Emirates</button>
                    <button class="airline-tab" type="button" data-airline="FZ"><img src="assets/flydubai-tail.png" alt="">flydubai</button>
                    <button class="airline-tab" type="button" data-airline="other">Other airlines</button>
                </div>

                <p class="result-count" id="result-count" aria-live="polite"></p>
                <div id="weekly-flights-list" aria-live="polite">
                    <div class="flights-loading">
                        <i class="fas fa-circle-notch fa-spin"></i>
                        <p>Loading this week's schedule from flight operations…</p>
                    </div>
                </div>

                <div class="discord-integration">
                    <p>Published every Sunday at 00:00 GMT · Last updated: <span id="update-time">just now</span></p>
                    <a href="https://emirates-ptfs-fids.onrender.com/departures" target="_blank" rel="noopener" class="discord-link">
                        <i class="fas fa-tv"></i> View the Live Departures Board
                    </a>
                </div>
            </section>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="script.js"></script>
<script>
    // Load header and footer components
    document.addEventListener('DOMContentLoaded', function() {
        const headerElement = document.getElementById('header');
        if (headerElement) {
            fetch('components/header.html')
                .then(response => response.text())
                .then(data => {
                    headerElement.innerHTML = data;
                    reinitComponents();
                })
                .catch(error => console.error('Error loading header:', error));
        }

        const footerElement = document.getElementById('footer');
        if (footerElement) {
            fetch('components/footer.html')
                .then(response => response.text())
                .then(data => {
                    footerElement.innerHTML = data;
                    initModal();
                })
                .catch(error => console.error('Error loading footer:', error));
        }
    });
</script>
</body>
</html>
